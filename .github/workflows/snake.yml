name: Generate Snake
on:
  schedule:
    - cron: '0 0 * * *'  
  workflow_dispatch:     
jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write         
    steps:
      - uses: actions/checkout@v3
      
      - uses: Platane/snk@v3
        with:
          github_user_name: amruhashim
          outputs: |
            dist/github-snake.svg?color_snake=orange&color_dots=#2d2d2d,#1e90ff,#00ff00,#9b59b6,#ff0000
            dist/github-snake-dark.svg?color_snake=orange&color_dots=#1a1a1a,#1e90ff,#00ff00,#9b59b6,#ff0000
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
          force: true
      
      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
